<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a11">
<title>凡哥的无止境 · 题海幻境篇 | 挂机放置 RPG</title>
<meta name="description" content="凡哥游戏宇宙出品：晚自习睡着的凡哥掉进了题海幻境，一路打上去才能醒来。自动战斗、无尽关卡、随机词条装备、+15 强化、技能、称号、转生——浏览器直接开玩，免下载。">
<meta property="og:title" content="凡哥的无止境 · 题海幻境篇">
<meta property="og:description" content="《战斗无止境》同款挂机 RPG，凡哥主题。点开即玩，免下载。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23070a11'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%235ad1ff' font-family='sans-serif' font-weight='bold'%3E凡%3C/text%3E%3C/svg%3E">
<style>
/* =====================================================================
 *  《凡哥的无止境》· 题海幻境篇  —— 样式表
 *  配色与 zhangzhefangame.online 主站保持一致（霓虹暗黑风）
 * ===================================================================== */
:root{
  --bg:#070a11;
  --panel:rgba(20,25,36,.84);
  --panel2:rgba(31,39,55,.72);
  --panel3:rgba(12,17,26,.86);
  --line:#242e42;
  --line2:#313d55;
  --txt:#e7ecf5;
  --dim:#8b98b1;
  --dim2:#6a768d;
  --acc:#5ad1ff;
  --gold:#ffcf6b;
  --violet:#8b5cff;
  --good:#5ee6a8;
  --bad:#ff7b8a;
  --warn:#ffa25a;
  --shadow:0 10px 30px rgba(0,0,0,.45);

  /* 品质色 */
  --q0:#9aa6b8;   /* 普通 */
  --q1:#5ee6a8;   /* 精良 */
  --q2:#5ad1ff;   /* 稀有 */
  --q3:#b98cff;   /* 史诗 */
  --q4:#ffb545;   /* 传说 */
  --q5:#ff6b8f;   /* 神话 */
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 620px at 12% -5%, rgba(90,209,255,.11), transparent 62%),
    radial-gradient(820px 620px at 102% 102%, rgba(139,92,255,.10), transparent 62%),
    radial-gradient(700px 480px at 60% 40%, rgba(255,207,107,.045), transparent 70%),
    var(--bg);
  background-attachment:fixed;
  color:var(--txt);
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC","Hiragino Sans GB",system-ui,-apple-system,sans-serif;
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.noscroll{overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.2)}
::-webkit-scrollbar-thumb{background:#2b3549;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#3a4763}

#app{max-width:1420px;margin:0 auto;padding:12px 12px 22px;display:grid;gap:11px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(7px)}
.hidden{display:none!important}
button{font-family:inherit}
.num{font-variant-numeric:tabular-nums}

/* ===================== 顶栏 ===================== */
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:9px;padding:10px 13px;position:sticky;top:8px;z-index:40}
.logo{font-size:16.5px;font-weight:800;letter-spacing:.4px;white-space:nowrap;line-height:1.25}
.logo b{color:var(--acc)}
.logo small{display:block;font-size:10.5px;font-weight:400;color:var(--dim2);letter-spacing:1.4px}
.res{margin-left:auto;display:flex;flex-wrap:wrap;gap:7px;align-items:center;font-size:12.5px}
.pill{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);white-space:nowrap;display:flex;align-items:center;gap:5px}
.pill i{font-style:normal;opacity:.85}
.pill b{color:var(--gold);font-variant-numeric:tabular-nums}
.pill.lv b{color:var(--acc)}
.pill.floor b{color:var(--violet)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);
  padding:6px 11px;border-radius:10px;font-size:12.5px;transition:.15s;white-space:nowrap;line-height:1.5}
.btn:hover{border-color:var(--acc);transform:translateY(-1px);background:rgba(90,209,255,.10)}
.btn:active{transform:none}
.btn:disabled{opacity:.34;cursor:not-allowed;transform:none!important;background:var(--panel2)}
.btn.on{border-color:var(--acc);color:var(--acc);background:rgba(90,209,255,.13)}
.btn.gold{border-color:rgba(255,207,107,.5);color:var(--gold)}
.btn.gold:hover{background:rgba(255,207,107,.12);border-color:var(--gold)}
.btn.danger{border-color:rgba(255,123,138,.45);color:var(--bad)}
.btn.danger:hover{background:rgba(255,123,138,.12);border-color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:11.5px;border-radius:8px}
.btn.wide{width:100%;text-align:center;padding:9px}

/* ===================== 主布局 ===================== */
.layout{display:grid;grid-template-columns:288px minmax(0,1fr) 344px;gap:11px;align-items:start}
@media (max-width:1240px){.layout{grid-template-columns:264px minmax(0,1fr) 310px}}
@media (max-width:1080px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.left,aside.right{position:static!important}
  /* 窄屏上把「战场」提到最前面：手机用户打开就想看打架，
     不该先滚过一整张立绘和一整页装备 */
  main.center{order:1}
  aside.left{order:2}
  aside.right{order:3}
  /* 立绘别把首屏撑满 */
  .face img{max-height:230px;object-fit:cover;object-position:center 22%}
}

/* ===================== 左栏 ===================== */
aside.left{display:grid;gap:11px}
.hero{padding:12px;display:grid;gap:10px}
.face{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#05070c}
.face img{display:block;width:100%;height:auto;transition:filter .5s,transform .5s}
.face .glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .7s;
  background:radial-gradient(130px 170px at 50% 28%, rgba(255,207,107,.34), transparent 70%)}
.face.rage .glow{opacity:1}
.face.hurt img{filter:brightness(.78) saturate(.6)}
.face.hurt .glow{opacity:1;background:radial-gradient(130px 170px at 50% 50%, rgba(255,80,100,.4), transparent 72%)}
.face .plate{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;font-size:11.5px;line-height:1.5;
  background:linear-gradient(transparent,rgba(3,6,12,.94));color:#dbe6f7}
.face .plate b{color:var(--gold)}
.face .titleTag{position:absolute;top:8px;left:8px;font-size:10.5px;padding:3px 8px;border-radius:999px;
  background:rgba(5,8,14,.8);border:1px solid var(--line);color:var(--gold);max-width:80%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face .rebirthTag{position:absolute;top:8px;right:8px;font-size:10.5px;padding:3px 8px;border-radius:999px;
  background:rgba(5,8,14,.8);border:1px solid rgba(139,92,255,.5);color:#c3a6ff}

/* 血条 */
.hpbar{height:15px;border-radius:99px;background:#0d121c;border:1px solid #1e2636;overflow:hidden;position:relative}
.hpbar i{display:block;height:100%;border-radius:99px;transition:width .28s ease;background:linear-gradient(90deg,#ff5f74,#ff9d6b)}
.hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;letter-spacing:.3px;text-shadow:0 1px 3px #000,0 0 4px #000;font-variant-numeric:tabular-nums}
.hpbar.mp i{background:linear-gradient(90deg,#5ad1ff,#8b5cff)}
.hpbar.xp i{background:linear-gradient(90deg,#ffcf6b,#ffe9b0)}
.hpbar.sm{height:11px}
.hpbar.sm span{font-size:9.5px}

/* 属性列表 */
.attrs{display:grid;gap:5px;font-size:12.5px}
.attr{display:grid;grid-template-columns:1fr auto;gap:8px;padding:5px 8px;border-radius:9px;background:rgba(10,15,23,.55);border:1px solid #1b2331}
.attr .k{color:var(--dim);display:flex;align-items:center;gap:5px}
.attr .v{color:var(--txt);font-variant-numeric:tabular-nums;font-weight:700}
.attr .v em{font-style:normal;color:var(--good);font-size:11px;font-weight:400;margin-left:3px}
.attr.alloc{background:rgba(90,209,255,.07);border-color:rgba(90,209,255,.28)}
.plus{cursor:pointer;border:1px solid var(--line2);background:rgba(90,209,255,.12);color:var(--acc);
  width:21px;height:21px;line-height:1;border-radius:6px;font-size:14px;font-weight:700;padding:0}
.plus:hover{background:rgba(90,209,255,.26);border-color:var(--acc)}
.plus:disabled{opacity:.28;cursor:not-allowed}
.secTitle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);letter-spacing:.6px;
  text-transform:uppercase;margin:2px 0 1px}
.secTitle:after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.pts{font-size:12px;color:var(--gold);background:rgba(255,207,107,.09);border:1px dashed rgba(255,207,107,.4);
  padding:6px 9px;border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  animation:ptsPulse 2.2s ease-in-out infinite}
@keyframes ptsPulse{
  0%,100%{background:rgba(255,207,107,.09);border-color:rgba(255,207,107,.4)}
  50%{background:rgba(255,207,107,.20);border-color:rgba(255,207,107,.85);box-shadow:0 0 14px rgba(255,207,107,.20)}
}
@media (prefers-reduced-motion:reduce){.pts{animation:none}}

/* 装备槽 */
.gearGrid{display:grid;gap:6px}
.slot{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:6px 8px;
  border-radius:9px;border:1px solid #1b2331;background:rgba(10,15,23,.55);cursor:pointer;transition:.15s;text-align:left;color:var(--txt);font-family:inherit;width:100%}
.slot:hover{border-color:var(--line2);background:rgba(90,209,255,.07)}
.slot.sel{border-color:var(--acc);background:rgba(90,209,255,.13);box-shadow:0 0 0 1px rgba(90,209,255,.3)}
.slot .ic{font-size:15px;text-align:center}
.slot .nm{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .nm i{font-style:normal;display:block;font-size:10px;color:var(--dim2);letter-spacing:.3px}
.slot .pl{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.slot .pl b{color:var(--gold)}
.slot .pl b.hi{color:#ff8fd0;text-shadow:0 0 8px rgba(255,143,208,.5)}
.slot.empty .nm{color:var(--dim2)}

/* 品质边框 */
.q0{border-left:2px solid var(--q0)!important}
.q1{border-left:2px solid var(--q1)!important}
.q2{border-left:2px solid var(--q2)!important}
.q3{border-left:2px solid var(--q3)!important}
.q4{border-left:2px solid var(--q4)!important}
.q5{border-left:2px solid var(--q5)!important}
.t0{color:var(--q0)}.t1{color:var(--q1)}.t2{color:var(--q2)}.t3{color:var(--q3)}.t4{color:var(--q4)}.t5{color:var(--q5)}

/* ===================== 中栏：战斗舞台 ===================== */
main.center{display:grid;gap:11px;min-width:0}
.stage{padding:12px 13px;display:grid;gap:10px;position:relative;overflow:hidden}
.zoneBar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px}
.zoneName{font-weight:700;color:var(--violet);letter-spacing:.5px}
.zoneName small{color:var(--dim2);font-weight:400;margin-left:5px;letter-spacing:0}
.depth{margin-left:auto;display:flex;gap:6px;align-items:center}

/* 竞技场 */
.arena{display:grid;grid-template-columns:1fr 62px 1fr;gap:8px;align-items:start;
  padding:12px 10px 36px;border-radius:12px;border:1px solid #1c2536;
  background:radial-gradient(340px 150px at 50% 0%, rgba(90,209,255,.07), transparent 70%),rgba(6,9,15,.55);
  position:relative;overflow:hidden}
/* 底部留出的空档是给飘字用的：否则伤害数字会飞到名字和血条上 */
.arena.flash-good:before,.arena.flash-bad:before{content:'';position:absolute;inset:0;pointer-events:none;animation:flash .38s ease}
.arena.flash-good:before{background:radial-gradient(320px 180px at 78% 50%, rgba(94,230,168,.22), transparent 70%)}
.arena.flash-bad:before{background:radial-gradient(320px 180px at 22% 50%, rgba(255,90,110,.22), transparent 70%)}
@keyframes flash{from{opacity:1}to{opacity:0}}
@media (max-width:520px){.arena{grid-template-columns:1fr 40px 1fr;padding:9px 7px 32px}}

.fighter{display:grid;gap:7px;min-width:0}
.fighter .who{display:flex;align-items:center;gap:7px;min-width:0}
.fighter .av{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;font-size:23px;
  border:1px solid var(--line2);background:linear-gradient(160deg,rgba(90,209,255,.14),rgba(10,15,23,.7));flex:none}
.fighter.foe .av{background:linear-gradient(160deg,rgba(255,123,138,.16),rgba(10,15,23,.7))}
.fighter .meta{min-width:0;flex:1}
.fighter .nm{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fighter .sub{font-size:10.5px;color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fighter.foe{text-align:right}
.fighter.foe .who{flex-direction:row-reverse}
.fighter .fx{font-size:11px;color:var(--dim);display:flex;gap:6px;justify-content:flex-end;min-height:14px;flex-wrap:wrap}
.fighter:not(.foe) .fx{justify-content:flex-start}
.fxTag{padding:1px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(10,15,23,.6);white-space:nowrap}
.fxTag.buff{color:var(--good);border-color:rgba(94,230,168,.4)}
.fxTag.debuff{color:var(--bad);border-color:rgba(255,123,138,.4)}

.vs{display:grid;place-items:center;gap:5px}
.vs .sw{font-size:19px;color:var(--line2)}
.vs .rounds{font-size:9.5px;color:var(--dim2);letter-spacing:.5px;white-space:nowrap}
@media (max-width:520px){.vs .rounds{display:none}.vs .sw{font-size:14px}}

/* 飘字 */
.float{position:absolute;font-weight:800;font-size:15px;pointer-events:none;
  text-shadow:0 2px 6px rgba(0,0,0,.95),0 0 10px rgba(0,0,0,.7);animation:floatUp .95s ease-out forwards;z-index:5;white-space:nowrap}
.float.dmg{color:#ffe08a}
.float.crit{color:#ff9a3c;font-size:19px}
.float.heal{color:var(--good)}
.float.miss{color:var(--dim);font-size:13px}
.float.hurt{color:var(--bad)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,4px) scale(.82)}
  20%{opacity:1;transform:translate(-50%,-2px) scale(1.06)}
  100%{opacity:0;transform:translate(-50%,-26px) scale(1)}}

/* 战斗日志 */
.logWrap{position:relative}
#log{overflow-y:auto;height:238px;padding-right:6px;display:flex;flex-direction:column;gap:3px;
  scroll-behavior:smooth;font-size:12.5px;line-height:1.6}
@media (max-width:1080px){#log{height:200px}}
@media (max-width:520px){#log{height:162px}}
.ln{animation:in .22s ease;border-left:2px solid transparent;padding-left:7px;color:#c3cee2}
.ln:first-child{}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.ln.sys{color:var(--dim2)}
.ln.good{color:var(--good);border-color:rgba(94,230,168,.5)}
.ln.bad{color:var(--bad);border-color:rgba(255,123,138,.5)}
.ln.epic{color:var(--gold);border-color:rgba(255,207,107,.6);font-weight:700}
.ln.loot{color:#c9b6ff;border-color:rgba(139,92,255,.45)}
.ln.kill{color:#ffd9a8}
.ln b{color:var(--gold)}
.ln .sm{color:var(--dim2);font-size:11.5px}

/* 战斗控制条 */
.ctrl{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding-top:2px}
.spd{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.spd button{border:0;background:transparent;color:var(--dim);padding:6px 10px;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit}
.spd button:hover{color:var(--txt);background:rgba(90,209,255,.08)}
.spd button.on{background:rgba(90,209,255,.18);color:var(--acc);font-weight:700}
.battleState{margin-left:auto;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 7px currentColor;animation:pulse 1.1s infinite}
.dot.off{background:var(--dim2);box-shadow:none;animation:none}
.dot.dead{background:var(--bad);box-shadow:0 0 7px var(--bad)}
@keyframes pulse{50%{opacity:.35}}

/* ===================== 右栏：标签面板 ===================== */
aside.right{position:sticky;top:76px}
.tabsPanel{padding:10px;display:grid;gap:9px}
.tabs{display:flex;flex-wrap:wrap;gap:5px}
.tab{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--dim);
  padding:6px 10px;border-radius:9px;font-size:12px;transition:.15s;font-family:inherit;position:relative}
.tab:hover{color:var(--txt);border-color:var(--line2)}
.tab.on{background:rgba(90,209,255,.16);border-color:var(--acc);color:var(--acc);font-weight:700}
.tab .badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;
  background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:700}
.tabBody{min-height:392px;max-height:min(64vh,620px);overflow-y:auto;padding-right:5px;display:grid;gap:8px;align-content:start}
@media (max-width:1080px){.tabBody{max-height:none;min-height:0}}
.empty{color:var(--dim2);font-size:12.5px;text-align:center;padding:26px 12px;line-height:1.9}

/* 物品卡片（背包 / 装备详情） */
.item{display:grid;gap:5px;padding:9px 10px;border-radius:10px;border:1px solid #1b2331;
  background:rgba(10,15,23,.6);cursor:pointer;transition:.15s;text-align:left;color:var(--txt);font-family:inherit;width:100%}
.item:hover{border-color:var(--line2);background:rgba(90,209,255,.06)}
.item.sel{border-color:var(--acc);background:rgba(90,209,255,.12)}
.item .hd{display:flex;align-items:center;gap:7px;min-width:0}
.item .hd .ic{font-size:16px;flex:none}
.item .hd .nm{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.item .hd .lv{font-size:11px;color:var(--dim);white-space:nowrap}
.item .hd .lv b{color:#ff8fd0}
.item .lines{font-size:11.5px;color:var(--dim);display:grid;gap:1px;line-height:1.55}
.item .lines .k{color:var(--dim2)}
.item .lines .up{color:var(--good)}
.item .lines .dn{color:var(--bad)}
.item .tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10.5px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);background:rgba(10,15,23,.6);white-space:nowrap}
.tag.up{color:var(--good);border-color:rgba(94,230,168,.4)}
.tag.dn{color:var(--bad);border-color:rgba(255,123,138,.4)}
.tag.gold{color:var(--gold);border-color:rgba(255,207,107,.4)}
.tag.v{color:var(--violet);border-color:rgba(139,92,255,.45)}
.item .acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}

/* 空槽 / 列表行 */
.pickList{display:grid;gap:6px}
.listRow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid #1b2331;
  background:rgba(10,15,23,.55);font-size:12.5px}
.listRow .grow{flex:1;min-width:0}
.listRow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.listRow .ds{font-size:11px;color:var(--dim2);line-height:1.5}
.listRow.locked{opacity:.5}

/* 技能卡 */
.skill{padding:9px 10px;border-radius:10px;border:1px solid #1b2331;background:rgba(10,15,23,.6);display:grid;gap:5px}
.skill.on{border-color:rgba(90,209,255,.5);background:rgba(90,209,255,.09)}
.skill.off{opacity:.72}
.skill .hd{display:flex;align-items:center;gap:7px}
.skill .hd .ic{font-size:17px}
.skill .hd .nm{font-weight:700;font-size:13px;flex:1}
.skill .ds{font-size:11.5px;color:var(--dim);line-height:1.55}
.skill .ft{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.skill .rate{font-size:11px;color:var(--acc);border:1px solid rgba(90,209,255,.35);border-radius:999px;padding:1px 7px}
.chanceWarn{font-size:11px;color:var(--warn)}
.chanceOver{font-size:11px;color:var(--bad)}

/* 称号 */
.titleCard{padding:8px 10px;border-radius:10px;border:1px solid #1b2331;background:rgba(10,15,23,.6);display:grid;gap:4px}
.titleCard.got{border-color:rgba(255,207,107,.42);background:linear-gradient(180deg,rgba(255,207,107,.09),rgba(10,15,23,.6))}
.titleCard .hd{display:flex;align-items:center;gap:7px}
.titleCard .hd .nm{font-weight:700;font-size:13px;color:var(--gold);flex:1}
.titleCard .ds{font-size:11px;color:var(--dim2)}
.titleCard .bo{font-size:11.5px;color:var(--good)}
.titleCard .pg{font-size:10.5px;color:var(--dim2)}

/* 伙伴 */
.pet{padding:9px 10px;border-radius:10px;border:1px solid #1b2331;background:rgba(10,15,23,.6);display:grid;gap:6px}
.pet.on{border-color:rgba(139,92,255,.5);background:linear-gradient(180deg,rgba(139,92,255,.11),rgba(10,15,23,.6))}
.pet .hd{display:flex;align-items:center;gap:8px}
.pet .av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:18px;
  border:1px solid var(--line2);background:rgba(139,92,255,.12);flex:none}
.pet .nm{font-weight:700;font-size:13px}
.pet .ds{font-size:11px;color:var(--dim2);line-height:1.5}
.pet .st{display:flex;flex-wrap:wrap;gap:5px;font-size:11px;color:var(--dim)}

/* 强化面板 */
.forge{padding:11px;border-radius:11px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,207,107,.07),rgba(10,15,23,.55));display:grid;gap:9px}
.forge .bd{display:flex;align-items:center;gap:9px}
.forge .bd .ic{font-size:26px}
.forge .bd .nm{font-weight:800;font-size:14px}
.forge .bd .sb{font-size:11px;color:var(--dim2)}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.odds div{padding:6px 4px;border-radius:9px;background:rgba(10,15,23,.6);border:1px solid #1b2331}
.odds .k{font-size:10.5px;color:var(--dim2)}
.odds .v{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.odds .v.ok{color:var(--good)}.odds .v.mid{color:var(--gold)}.odds .v.risk{color:var(--bad)}
.pre{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:11.5px}
.pre div{padding:5px 8px;border-radius:8px;background:rgba(10,15,23,.55);border:1px solid #1b2331;display:flex;justify-content:space-between;gap:6px}
.pre .k{color:var(--dim2)}
.pre .v{font-variant-numeric:tabular-nums;font-weight:700}

/* 设置 */
.set{display:grid;gap:7px}
.setRow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;border:1px solid #1b2331;background:rgba(10,15,23,.55);font-size:12.5px}
.setRow .grow{flex:1;min-width:0}
.setRow .ds{font-size:10.5px;color:var(--dim2);line-height:1.5}
textarea{width:100%;min-height:66px;background:#0a0e16;border:1px solid var(--line);color:var(--dim);
  border-radius:9px;padding:8px;font-family:ui-monospace,Consolas,monospace;font-size:11px;resize:vertical}
input[type=text]{width:100%;background:#0a0e16;border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:7px 9px;font-size:12px;font-family:inherit}
.slider{flex:1;accent-color:var(--acc)}

/* ===================== 弹窗 ===================== */
.mask{position:fixed;inset:0;background:rgba(3,5,10,.78);backdrop-filter:blur(3px);z-index:90;
  display:grid;place-items:center;padding:16px;animation:in .2s ease}
.modal{max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:18px 20px;display:grid;gap:12px}
.modal h2{margin:0;font-size:19px;color:var(--acc);letter-spacing:.5px}
.modal h3{margin:0;font-size:14px;color:var(--gold)}
.modal p{margin:0;line-height:1.85;font-size:13.5px;color:#cdd8ea}
.modal ul{margin:0;padding-left:19px;line-height:1.9;font-size:13px;color:#c3cee2}
.modal li b{color:var(--gold)}
.modal hr{border:0;border-top:1px solid var(--line);margin:2px 0}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.kbd{display:inline-block;min-width:15px;text-align:center;font-size:10.5px;color:var(--dim);
  border:1px solid var(--line);border-radius:5px;padding:0 4px;margin-right:4px;vertical-align:1px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:7px}
.stat-grid div{padding:8px 10px;border-radius:10px;background:rgba(10,15,23,.6);border:1px solid #1b2331}
.stat-grid .k{font-size:10.5px;color:var(--dim2)}
.stat-grid .v{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold)}

/* toast */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:120;display:grid;gap:7px;justify-items:center;pointer-events:none}
.toast{background:rgba(10,14,22,.96);border:1px solid var(--line2);color:var(--txt);padding:8px 16px;
  border-radius:999px;font-size:12.5px;box-shadow:var(--shadow);animation:toastIn .25s ease;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.good{border-color:rgba(94,230,168,.6);color:var(--good)}
.toast.bad{border-color:rgba(255,123,138,.6);color:var(--bad)}
.toast.gold{border-color:rgba(255,207,107,.6);color:var(--gold)}
@keyframes toastIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

footer.note{color:var(--dim2);font-size:11.5px;text-align:center;line-height:1.85;padding:2px 10px}
footer.note a{color:var(--dim);text-decoration:none;border-bottom:1px dashed var(--line2)}
footer.note a:hover{color:var(--acc)}

</style>
</head>

<script>

/* ==================== src/js/00-core.js ==================== */
/* =====================================================================
 *  《凡哥的无止境》· 题海幻境篇
 *  00-core —— 工具函数 / 数值平衡 / 静态数据表
 *  致敬 Crit Games《战斗无止境》(Battle without End)
 * ===================================================================== */
'use strict';

/* ---------------------------------------------------------------
 *  0. 工具
 * --------------------------------------------------------------- */
const $ = s => document.querySelector(s);
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const rndf = (a, b) => Math.random() * (b - a) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const chance = p => Math.random() < p;

/** 大数格式化：1.2万 / 3.4亿 */
function fmt(n) {
  n = Math.floor(n);
  if (!isFinite(n)) return '∞';
  const a = Math.abs(n);
  if (a < 10000) return String(n);
  if (a < 1e8) return (n / 1e4).toFixed(a < 1e6 ? 2 : 1).replace(/\.0+$/, '') + '万';
  if (a < 1e12) return (n / 1e8).toFixed(2).replace(/\.0+$/, '') + '亿';
  if (a < 1e16) return (n / 1e12).toFixed(2).replace(/\.0+$/, '') + '兆';
  return n.toExponential(2);
}
/** 带千分位 */
function fmtc(n) { return Math.floor(n).toLocaleString('en-US'); }
/** 秒 → 1小时23分 */
function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (h) return h + ' 小时 ' + m + ' 分';
  if (m) return m + ' 分 ' + s + ' 秒';
  return s + ' 秒';
}
function pct(v, d = 1) { return (v * 100).toFixed(d) + '%'; }

/* ---------------------------------------------------------------
 *  1. 全局数值平衡（想调手感只改这里）
 * --------------------------------------------------------------- */
const BAL = {
  /* --- 成长 --- */
  ptsPerLevel: 5,          // 每级属性点
  startPts: 20,            // 初始属性点
  skillPtEvery: 2,         // 每 N 级 1 技能点

  /* --- 一级属性 → 二级属性 --- */
  atkPerInt: 2.4,
  hpPerPhy: 16,
  defPerPhy: 1.1,
  spdPerAgi: 0.9,
  critPerAgi: 0.0012,
  luckPerLuk: 1.0,
  baseAtk: 10, baseHp: 150, baseDef: 5, baseSpd: 12, baseCrit: 0.05, baseCdmg: 1.5, baseLuck: 5,

  /* --- 怪物成长 ---
   * 不用「HP = a·f^b」这种直接公式（玩家的战力是多条乘法线叠加的，
   * 任何固定指数迟早会被甩开，曲线就变成一路平推）。
   * 改成：先定义一个「装备水平刚好跟得上这一层」的参考玩家，
   * 再按两个直观的难度参数反推怪物数值：
   *    killRounds(f) —— 参考玩家需要几回合打死怪物（越大越肉）
   *    dieRounds(f)  —— 参考玩家能扛几回合（越小越危险）
   * 当 killRounds > dieRounds 时就是墙，玩家必须回头刷装备 / 强化 / 转生。
   */
  killBase: 3, killK: 0.9, killE: 0.72,
  dieBase: 30, dieHalf: 60,
  mobDefRatio: 0.35,       // 怪物防御 = 参考玩家攻击 × 该比例
  /* 前若干层额外减负：新玩家还没攒齐装备，参考模型会高估他 */
  earlyRampK: 0.32, earlyRampF: 55,

  /* 参考玩家（第 f 层「够用」的配置） */
  REF: {
    enh: 7,                // 假设强化到 +7
    weapon: [3.2, 1.45],   // 主手攻击
    body: [26, 1.45],      // 衣服生命
    head: [1.2, 1.40],     // 头部防御
    atkMul: 2.4,           // 副手 / 词条 / 加点的整体倍率
    hpMul: 3.2,
    defMul: 2.6,
  },
  mSpd: 11, mSpdPerFloor: 0.22,
  /* 精英 / BOSS：血量只适度提高，主要靠「更凶」制造压力。
     血量翻太多会让单场战斗拖到几十回合，玩起来只有枯燥没有紧张。 */
  eliteMult: { hp: 1.6, atk: 1.30, def: 1.15, gold: 3, xp: 2.5, drop: 0.5 },
  bossMult: { hp: 1.9, atk: 1.65, def: 1.30, gold: 9, xp: 7, drop: 1 },

  /* --- 伤害 ---
   * 用「尺度无关」公式：dmg = ATK² / (ATK + DEF*defW)
   *   - DEF = 0        → dmg = ATK
   *   - DEF = ATK      → dmg = ATK/2
   *   - 双方同比例放大   → 伤害同比例放大（不会因为数值膨胀而互相免疫）

function newGame() {
  return {
    v: SAVE_VER,
    /* 成长 */
    lv: 1, exp: 0, pts: BAL.startPts, sp: 0,
    alloc: { int: 0, phy: 0, agi: 0, luk: 0 },
    /* 资源 */
    gold: 0, totalGold: 0,
    /* 进度 */
    floor: 1, maxFloor: 1, kills: 0, bossKills: 0, deaths: 0,
    wallFloor: 0, wallPower: 0,   // 撞死在哪一层 / 当时的战力（用于卡墙刷级）
    hp: 1,                       // 进游戏时补满
    /* 装备 */
    gear: { main: null, off: null, head: null, body: null, feet: null, acc1: null, acc2: null },
    bag: [],
    /* 技能 */
    skills: [],                  // 已装备主动技能 id
    passives: {},                // id -> 等级
    /* 收集 */
    titles: {},                  // id -> true
    pets: {},                    // id -> true
    activePet: null,
    /* 转生 */
    rebirth: 0, power: 0, maxEnh: 0, maxRarity: 0,
    /* 设置 */
    speed: 1, auto: true, autoFloor: true, autoSell: -1, autoEnh: false,
    /* 杂项 */
    startedTs: Date.now(), lastTs: Date.now(), playSec: 0, rounds: 0, deathsAt: 0,
    seenHelp: false, uid: 1,
  };
}

/* ---------------------------------------------------------------
 *  称号加成汇总
 * --------------------------------------------------------------- */
function titleBonus(S) {
  const b = { allPct: 0, atkPct: 0, hpPct: 0, goldPct: 0, spd: 0, crit: 0, cdmg: 0, luck: 0, ls: 0, pen: 0 };
  for (const t of TITLES) {
    if (!S.titles[t.id]) continue;
    for (const k in t.bonus) b[k] = (b[k] || 0) + t.bonus[k];
  }
  return b;
}

/* ---------------------------------------------------------------
 *  单件装备 → 属性累加
 * --------------------------------------------------------------- */
function addItemStats(st, it, mult) {
  const m = (mult === undefined ? 1 : mult) * (1 + ENH_GAIN * (it.enh || 0));
  for (const k in it.prim) st[k] = (st[k] || 0) + it.prim[k] * m;
  for (const a of it.aff) st[a.id] = (st[a.id] || 0) + a.v * m;
}

/* 单件装备「战力」粗估，用于掉落对比提示 */
const POWER_W = { atk: 4, hp: 0.55, def: 2.2, spd: 3.2, crit: 420, cdmg: 90, luck: 1.4, ls: 900, pen: 700 };
function itemPower(it) {
  if (!it) return 0;
  const st = { atk: 0, hp: 0, def: 0, spd: 0, crit: 0, cdmg: 0, luck: 0, ls: 0, pen: 0 };
  addItemStats(st, it);
  let p = 0;
  for (const k in st) p += st[k] * (POWER_W[k] || 1);
  return p;
}
/** 玩家整体战力（用于统计面板） */
function combatPower(st) {
  return Math.round(
    st.atk * 4 + st.hp * 0.55 + st.def * 2.2 + st.spd * 3.2 +
    st.crit * 420 + (st.cdmg - 1.5) * 900 + st.luck * 1.4 + st.ls * 900 + st.pen * 700
  );
}

/* ---------------------------------------------------------------
 *  二级属性总计算
 * --------------------------------------------------------------- */
function computeStats() {
  const S = G, A = S.alloc, P = S.passives;
  const st = { atk: 0, hp: 0, def: 0, spd: 0, crit: 0, cdmg: 0, luck: 0, ls: 0, pen: 0 };

  /* 1. 基础（等级只提供属性点，不再额外乘一个随等级线性增长的系数——
        否则「等级系数 × 装备成长」会叠加成平方级增长，怪物怎么调都追不上） */
  st.atk = BAL.baseAtk + A.int * BAL.atkPerInt;
  st.hp = BAL.baseHp + A.phy * BAL.hpPerPhy;
  st.def = BAL.baseDef + A.phy * BAL.defPerPhy;
  st.spd = BAL.baseSpd + A.agi * BAL.spdPerAgi;
  st.crit = BAL.baseCrit + A.agi * BAL.critPerAgi;
  st.cdmg = BAL.baseCdmg;
  st.luck = BAL.baseLuck + A.luk * BAL.luckPerLuk;

  /* 2. 装备 */
  for (const sid of SLOT_IDS) if (S.gear[sid]) addItemStats(st, S.gear[sid]);

  /* 3. 被动技能 */
  st.atk *= 1 + 0.04 * (P.biggan || 0);
  st.hp *= 1 + 0.05 * (P.kangzao || 0);
  st.def *= 1 + 0.03 * (P.kangzao || 0);
  st.crit += 0.015 * (P.yanji || 0);
  st.luck += 8 * (P.xingyunxing || 0);

  /* 4. 称号（叠加） */
  const tb = titleBonus(S);
  if (tb.allPct) { st.atk *= 1 + tb.allPct; st.hp *= 1 + tb.allPct; st.def *= 1 + tb.allPct; st.spd *= 1 + tb.allPct; }
  if (tb.atkPct) st.atk *= 1 + tb.atkPct;
  if (tb.hpPct) st.hp *= 1 + tb.hpPct;
  st.spd += tb.spd; st.crit += tb.crit; st.cdmg += tb.cdmg;
  st.luck += tb.luck; st.ls += tb.ls; st.pen += tb.pen;

  /* 5. 转生「凡力」 */
  const pw = 1 + S.power * BAL.powerPerPoint;
  st.atk *= pw; st.hp *= pw; st.def *= pw; st.spd *= pw;
  st.luck += S.power * BAL.luckPerPoint;

  /* 6. 同桌伙伴 */
  if (S.activePet === 'xiaoyu') { st.crit += 0.04; st.hp *= 1.05; }
  if (S.activePet === 'tiezhu') { st.def *= 1.12; }
  if (S.activePet === 'xueba') { st.atk *= 1.05; }
  if (S.activePet === 'banzhuren') { st.luck += 20; }

  /* 7. 收尾夹取（每一条百分比都必须有上限，否则后期会指数级炸开） */
  st.crit = clamp(st.crit, 0, 0.85);
  st.cdmg = clamp(st.cdmg, BAL.critMultBase, 5.0);
  st.ls = clamp(st.ls, 0, 0.60);
  st.pen = clamp(st.pen, 0, 0.90);

  /* 8. 派生非战斗属性 */
  st.goldPct = 0.06 * (P.licai || 0) + (tb.goldPct || 0) + S.power * 0.01;
  st.xpPct = 0.03 * (P.licai || 0) + S.power * 0.01;
  st.dmgReduce = clamp(0.02 * (P.tihai || 0), 0, 0.40);
  st.skillRate = Math.min(SKILL_RATE_CAP, SKILL_BASE_RATE + 0.05 * (P.shougan || 0));
  st.power = combatPower(st);
  return st;
}

/* ---------------------------------------------------------------
 *  升级所需经验
 * --------------------------------------------------------------- */
function xpNeed(lv) { return Math.floor(BAL.xpNeedK * Math.pow(lv, BAL.xpNeedE)); }

/* ---------------------------------------------------------------
 *  给经验 / 升级
 * --------------------------------------------------------------- */
function gainExp(n) {
  const S = G;
  S.exp += n;
  let ups = 0;
  while (S.lv < 9999 && S.exp >= xpNeed(S.lv)) {
    S.exp -= xpNeed(S.lv);
    S.lv++;
    S.pts += BAL.ptsPerLevel;
    ups++;
    if (S.lv % BAL.skillPtEvery === 0) S.sp += 1;
    if (S.lv >= 200 && S.lv % 50 === 0) S.sp += 5;   // 后期补一点技能点
  }
  return ups;
}

/* ---------------------------------------------------------------
 *  当前区域信息
 * --------------------------------------------------------------- */
function zoneOf(floor) {
  const idx = Math.floor((floor - 1) / ZONE_EVERY);
  const z = ZONES[idx % ZONES.length];
  const cyc = Math.floor(idx / ZONES.length);
  return { ...z, cyc, idx };
}
function depthOf(floor) { return Math.floor((floor - 1) / CYCLE_EVERY) + 1; }

/** 怪物是否精英 / BOSS */
function mobKind(floor) {
  if (floor % 10 === 0) return 'boss';
  if (floor % 5 === 0) return 'elite';
  return 'normal';
}

/* ---------------------------------------------------------------
 *  存档 / 读档 / 导入导出
 * --------------------------------------------------------------- */
function saveGame(silent) {
  try {
    G.lastTs = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(G));
    if (!silent) toast('💾 已存档', 'good');
    return true;
  } catch (e) {
    if (!silent) toast('存档失败：' + e.message, 'bad');
    return false;
  }
}

function loadGame() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { raw = null; }
  if (!raw) return null;
  try {
    const d = JSON.parse(raw);
    return migrate(d);
  } catch (e) { return null; }
}

/** 兼容/补全字段，防止旧档或手改档导致崩溃 */
function migrate(d) {
  const base = newGame();
  const S = Object.assign(base, d || {});
  S.alloc = Object.assign({ int: 0, phy: 0, agi: 0, luk: 0 }, d && d.alloc);
  S.gear = Object.assign(base.gear, d && d.gear);
  S.passives = Object.assign({}, d && d.passives);
  S.titles = Object.assign({}, d && d.titles);
  S.pets = Object.assign({}, d && d.pets);
  S.bag = Array.isArray(S.bag) ? S.bag.filter(Boolean) : [];
  S.skills = Array.isArray(S.skills) ? S.skills.filter(id => SKILL_BY_ID[id]) : [];
  S.v = SAVE_VER;
  if (!(S.hp > 0)) S.hp = 1;
  return S;
}

function exportSave() {
  try {
    const json = JSON.stringify(G);
    return b64enc(json);
  } catch (e) { return ''; }
}
function importSave(str) {
  try {
    const d = JSON.parse(b64dec(String(str).trim()));
    if (!d || typeof d !== 'object' || !('lv' in d)) throw new Error('格式不对');
    G = migrate(d);
    afterLoad();
    toast('✅ 存档已导入', 'good');
    return true;
  } catch (e) {
    toast('导入失败：' + e.message, 'bad');
    return false;
  }
}
/* 支持中文的 base64（分块处理，避免大存档撑爆调用栈） */
function b64enc(s) {
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return btoa(bin);
}
function b64dec(s) {
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---------------------------------------------------------------
 *  离线收益
 * --------------------------------------------------------------- */
/** 用真实战斗公式，模拟离线期间的挂机收益（不做渲染） */
function calcOffline(seconds) {
  const S = G;
  const st = computeStats();
  const rate = BAL.offlineRate;
  const rounds = Math.floor(seconds * 1000 / ROUND_MS * rate);
  if (rounds < 5) return null;

  const floor = S.floor;
  const gold0 = S.gold;
  let gold = 0, exp = 0, kills = 0, drops = 0, roundsLeft = rounds;
  /* 离线时不推进层数：只按当前层反复刷（安全、可预期） */
  let sim = mkMob(floor);

  while (roundsLeft > 0 && kills < 4000) {
    /* 一次「虚拟战斗」：双方互殴直到怪物死 */
    let hp = st.hp, mhp = sim.hp, guard = 0;
    while (mhp > 0 && hp > 0 && roundsLeft > 0 && guard++ < BAL.maxRound) {
      roundsLeft--;
      const d = calcDamage(st, sim, null);
      mhp -= d.dmg;
      if (mhp <= 0) break;
      const back = calcDamage(sim, st, null);
      hp -= back.dmg;
      if (st.ls > 0) hp = Math.min(st.hp, hp + d.dmg * st.ls);
    }
    if (mhp > 0 && hp <= 0) { roundsLeft = 0; break; }   // 打不过：离线收益到此为止
    if (mhp > 0) break;
    kills++;
    gold += sim.gold;
    exp += sim.xp;
    if (chance(sim.drop)) drops++;
    roundsLeft -= 2;                                      // 换怪的空档
    sim = mkMob(floor);
  }
  if (kills === 0) return null;

  /* 掉落折算：按品质期望直接换算成金币（避免离线产生几百件装备） */
  const avgIlvl = floor;
  gold = Math.floor(gold * (1 + st.goldPct));
  const dropGold = drops * Math.floor(avgIlvl * 26);
  return { seconds, rounds, kills, gold: gold + dropGold, exp, drops, dropGold };
}

function applyOffline(res) {
  if (!res) return;
  G.gold += res.gold; G.totalGold += res.gold;
  G.kills += res.kills;
  const ups = gainExp(res.exp);
  G.hp = computeStats().hp;
  checkTitles();
  showOfflineModal(res, ups);
}


/* ==================== src/js/20-battle.js ==================== */
/* =====================================================================
 *  20-battle —— 怪物生成 / 伤害公式 / 自动战斗循环 / 掉落 / 升级 / 转生
 * ===================================================================== */

/* 实时战斗状态（不存档） */
const B = {
  mob: null,
  round: 0,
  timer: null,
  buffs: { shield: 0, defBuff: 0, defTurns: 0, mobDefDown: 0, mobDefDownTurns: 0 },
  headless: false,      // 测试模式：不启动定时器，由测试脚本手动驱动
  dead: false,
};

/* ---------------------------------------------------------------
 *  难度曲线
 *  refStats(f) —— 第 f 层「装备刚好跟得上」的参考玩家属性
 *  killRounds / dieRounds —— 两个可直接调的难度旋钮
 * --------------------------------------------------------------- */
function refStats(f) {
  const R = BAL.REF;
  const e = 1 + ENH_GAIN * R.enh;
  return {
    atk: R.weapon[0] * Math.pow(f, R.weapon[1]) * e * R.atkMul,
    hp: R.body[0] * Math.pow(f, R.body[1]) * e * R.hpMul,
    def: R.head[0] * Math.pow(f, R.head[1]) * e * R.defMul,
  };
}
/** 参考玩家打死一只怪需要几回合（随层数缓慢变长 = 越往上越肉） */
function killRounds(f) { return BAL.killBase + BAL.killK * Math.pow(f, BAL.killE); }
/** 参考玩家能扛几回合（随层数变短 = 越往上越危险） */
function dieRounds(f) { return BAL.dieBase / (1 + f / BAL.dieHalf); }
/** 前若干层额外减负系数：新档还没攒齐装备，参考模型会高估他 */
function earlyRamp(f) { return BAL.earlyRampK + (1 - BAL.earlyRampK) * Math.min(1, f / BAL.earlyRampF); }

/* ---------------------------------------------------------------
 *  怪物生成
 * --------------------------------------------------------------- */
function mkMob(floor) {
  const kind = mobKind(floor);
  let nm, ic;
  if (kind === 'boss') {
    const b = BOSS_POOL[Math.floor(floor / 10 - 1) % BOSS_POOL.length];
    nm = b.nm; ic = b.ic;
  } else {
    const m = MOBS[Math.floor(floor * 7 + floor / 10) % MOBS.length];
    nm = m.nm; ic = m.ic;
  }

  const ref = refStats(floor);
  const ramp = earlyRamp(floor);

  /* 防御取参考攻击的一个固定比例 → 参考玩家的每回合伤害 */
  let def = ref.atk * BAL.mobDefRatio;
  const refDmg = ref.atk * ref.atk / (ref.atk + def * BAL.defW + 1);
  let hp = refDmg * killRounds(floor);

  /* 反解怪物攻击力，使参考玩家刚好能扛 dieRounds 回合：
       D = ref.hp / dieRounds
       D = atk² / (atk + ref.def*defW)   →   atk² - D·atk - D·refDef = 0
   */
  const D = ref.hp / Math.max(0.5, dieRounds(floor));
  const refDef = ref.def * BAL.defW;
  let atk = (D + Math.sqrt(D * D + 4 * D * refDef)) / 2;

  /* 前期减负 */
  hp *= ramp; atk *= ramp; def *= ramp;

  let spd = BAL.mSpd + floor * BAL.mSpdPerFloor;
  let gold = BAL.goldK * Math.pow(floor, BAL.goldE);
  let xp = BAL.xpK * Math.pow(floor, BAL.xpE);
  let drop = Math.min(BAL.dropCap, BAL.dropBase + floor * 0.0005);

  if (kind === 'elite') {
    const m = BAL.eliteMult;
    hp *= m.hp; atk *= m.atk; def *= m.def; gold *= m.gold; xp *= m.xp; drop += m.drop;
    nm = pick(ELITE_PREFIX) + nm;
  } else if (kind === 'boss') {
    const m = BAL.bossMult;
    hp *= m.hp; atk *= m.atk; def *= m.def; gold *= m.gold; xp *= m.xp; drop = 1;
  }

  const z = zoneOf(floor);
  return {
    floor, kind, nm, ic,
    zone: z.nm,
    maxHp: Math.max(1, Math.round(hp)), hp: Math.max(1, Math.round(hp)),
    atk: Math.round(atk), def: Math.round(def), spd: Math.round(spd * 10) / 10,
    crit: clamp(0.05 + floor * 0.0005, 0, 0.30),
    cdmg: 1.5, pen: 0,
    gold: Math.round(gold), xp: Math.round(xp),
    drop: Math.min(BAL.dropCap, drop),
  };
}

/* ---------------------------------------------------------------
 *  伤害公式（尺度无关）
 *    dmg = ATK² / (ATK + DEF*defW)
 *  无视防御按比例削减 DEF，让「破甲」在后期依然有意义。
 * --------------------------------------------------------------- */
function dmgCore(a, d, opts) {
  const pen = clamp((a.pen || 0) + (opts.pen || 0), 0, 0.92);
  const def = Math.max(0, (d.def || 0) * (1 - pen)) * BAL.defW;
  const atk = Math.max(0, (a.atk || 0) * (opts.mult || 1));
  const base = atk * atk / (atk + def + 1);
  const critChance = clamp((a.crit || 0) + (opts.critAdd || 0), 0, 0.95);
  const critMult = Math.max(1, a.cdmg || BAL.critMultBase);
  return { base, critChance, critMult };
}
/** 带随机的一次伤害 */
function calcDamage(a, d, opts) {
  const c = dmgCore(a, d, opts || {});
  const isCrit = chance(c.critChance);
  return { dmg: Math.max(BAL.minDmg, c.base * (isCrit ? c.critMult : 1)), crit: isCrit };
}
/** 期望伤害（界面预估用，不带随机） */
function avgDamage(a, d, opts) {
  const c = dmgCore(a, d, opts || {});
  return Math.max(BAL.minDmg, c.base * (1 + c.critChance * (c.critMult - 1)));
}

/* ---------------------------------------------------------------
 *  掉落品质
 * --------------------------------------------------------------- */
function rollRarity(luck, floor, kind) {
  /* boost 必须封顶：否则「幸运 → 更好装备 → 更高幸运」会变成无限正反馈 */
  const raw = 1 + luck * 0.0015 + floor * 0.0008 +
    (kind === 'boss' ? 0.55 : kind === 'elite' ? 0.22 : 0);
  const boost = Math.min(6, raw);
  const w = RARITY.map(r => r.w);
  w[1] *= boost;
  w[2] *= Math.pow(boost, 1.6);
  w[3] *= Math.pow(boost, 2.4);
  w[4] *= Math.pow(boost, 3.2);
  const total = w.reduce((a, b) => a + b, 0);
  let r = Math.random() * total;
  for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i; }
  return 0;
}

/* ---------------------------------------------------------------
 *  技能触发
 *  与原著一致：同类技能平分释放率，总释放率封顶 95%
 * --------------------------------------------------------------- */
function skillRates(S, st) {
  const atk = S.skills.filter(id => SKILL_BY_ID[id] && SKILL_BY_ID[id].type === 'atk');
  const def = S.skills.filter(id => SKILL_BY_ID[id] && SKILL_BY_ID[id].type === 'def');
  const out = {};
  if (atk.length) { const each = st.skillRate / atk.length; atk.forEach(id => { out[id] = each; }); }
  if (def.length) { const each = st.skillRate / def.length; def.forEach(id => { out[id] = each; }); }
  return { rates: out, atkCount: atk.length, defCount: def.length, total: st.skillRate };
}
/** 从一组技能里按各自概率挑一个触发（最多一个） */
function rollSkill(ids, rates) {
  for (const id of ids) if (chance(rates[id] || 0)) return id;
  return null;
}
function equippedOf(S, type) {
  return S.skills.filter(id => SKILL_BY_ID[id] && SKILL_BY_ID[id].type === type);
}

/* ---------------------------------------------------------------
 *  单回合结算（纯逻辑，UI / 离线 / 测试共用）
 *  返回事件数组交给 UI 播报
 * --------------------------------------------------------------- */
function fightRound() {
  const S = G, st = computeStats(), mob = B.mob;
  const ev = [];
  if (!mob || mob.hp <= 0 || S.hp <= 0) return ev;

  B.round++;
  S.rounds++;

  /* 回合开始的持续效果结算 */
  if (B.buffs.defTurns > 0) { B.buffs.defTurns--; if (B.buffs.defTurns === 0) B.buffs.defBuff = 0; }
  if (B.buffs.mobDefDownTurns > 0) { B.buffs.mobDefDownTurns--; if (B.buffs.mobDefDownTurns === 0) B.buffs.mobDefDown = 0; }
  B.buffs.shield = 0;                                    // 护盾只持续本回合

  /* 速度决定先手；速度翻倍可连击 */
  const heroFirst = st.spd >= mob.spd;
  const heroDouble = st.spd >= mob.spd * 2;
  const order = heroFirst ? ['hero', 'mob'] : ['mob', 'hero'];

  const sr = skillRates(S, st);

  for (const side of order) {
    if (mob.hp <= 0 || S.hp <= 0) break;

    if (side === 'hero') {
      /* 攻击技能 */
      const atkIds = equippedOf(S, 'atk');
      const used = rollSkill(atkIds, sr.rates);
      const swings = used ? (SKILL_BY_ID[used].hits || 1) : (heroDouble ? 2 : 1);

      for (let i = 0; i < swings && mob.hp > 0; i++) {
        const sk = used ? SKILL_BY_ID[used] : null;
        const mobDef = { def: mob.def * (1 - B.buffs.mobDefDown) };
        const r = calcDamage(st, mobDef, sk ? { mult: sk.mult, critAdd: sk.critAdd || 0, pen: sk.pen || 0 } : {});
        mob.hp -= r.dmg;
        ev.push({ t: 'hit', side: 'mob', dmg: r.dmg, crit: r.crit, skill: sk ? sk.nm : null });
        if (st.ls > 0) {
          const before = S.hp;
          S.hp = Math.min(st.hp, S.hp + r.dmg * st.ls);
          if (S.hp - before > 0.5) ev.push({ t: 'lifesteal', heal: S.hp - before });
        }
      }
    } else {
      /* 防御技能：怪物出手前触发 */
      const defIds = equippedOf(S, 'def');
      const used = rollSkill(defIds, sr.rates);
      let shield = 0;
      if (used) {
        const sk = SKILL_BY_ID[used];
        if (sk.shield) { shield = sk.shield; B.buffs.shield = sk.shield; ev.push({ t: 'skill', nm: sk.nm, kind: 'shield', v: sk.shield }); }
        if (sk.heal) {
          const before = S.hp;
          S.hp = Math.min(st.hp, S.hp + st.hp * sk.heal);
          ev.push({ t: 'skill', nm: sk.nm, kind: 'heal', v: S.hp - before });
        }
        if (sk.buffDef) {
          B.buffs.defBuff = sk.buffDef;
          B.buffs.defTurns = (sk.turns || 3) + 1;
          ev.push({ t: 'skill', nm: sk.nm, kind: 'buff', v: sk.buffDef, turns: sk.turns || 3 });
        }
      }

      /* 同桌护场 */
      const petGuard = (S.activePet === 'tiezhu') ? 0.35 : 0;

      const r = calcDamage(mob, st, {});
      let dmg = r.dmg;
      if (B.buffs.defBuff) dmg *= (1 - B.buffs.defBuff);
      if (shield) dmg *= (1 - shield);
      if (petGuard) dmg *= (1 - petGuard);
      if (st.dmgReduce) dmg *= (1 - st.dmgReduce);
      dmg = Math.max(BAL.minDmg, dmg);
      S.hp -= dmg;
      ev.push({ t: 'hit', side: 'hero', dmg, crit: r.crit, pet: petGuard ? 'tiezhu' : null });
    }
  }

  /* 同桌伙伴的额外行动 */
  if (mob.hp > 0 && S.hp > 0) {
    if (S.activePet === 'xiaoyu') {
      const before = S.hp;
      S.hp = Math.min(st.hp, S.hp + st.hp * 0.04);
      if (S.hp - before > 0.5) ev.push({ t: 'pet', pet: 'xiaoyu', heal: S.hp - before });
    } else if (S.activePet === 'xueba' && mob.hp > 0) {
      const r = calcDamage(st, mob, { mult: 0.60 });
      mob.hp -= r.dmg;
      ev.push({ t: 'pet', pet: 'xueba', dmg: r.dmg, crit: r.crit });
    } else if (S.activePet === 'banzhuren' && chance(0.30)) {
      B.buffs.mobDefDown = Math.min(0.60, B.buffs.mobDefDown + 0.20);
      B.buffs.mobDefDownTurns = 3;
      ev.push({ t: 'pet', pet: 'banzhuren' });
    }
  }

  /* 收尾 */
  if (S.hp < 0) S.hp = 0;
  if (mob.hp < 0) mob.hp = 0;
  if (S.hp <= 0) ev.push({ t: 'heroDown' });
  else if (mob.hp <= 0) ev.push({ t: 'mobDown' });
  else if (B.round > BAL.maxRound) { mob.hp = 0; ev.push({ t: 'mobDown', timeout: true }); }

  return ev;
}

/* ---------------------------------------------------------------
 *  击杀结算：金币 / 经验 / 掉落 / 升级 / 推进最高层
 * --------------------------------------------------------------- */
function onKill(mob) {
  const S = G, st = computeStats();
  const gold = Math.round(mob.gold * (1 + st.goldPct));
  const xp = Math.round(mob.xp * (1 + st.xpPct));
  S.gold += gold; S.totalGold += gold;
  S.kills++;
  if (mob.kind === 'boss') S.bossKills++;
  /* 只有真的打死，才算推进了历史最高层 */
  if (mob.floor > S.maxFloor) S.maxFloor = mob.floor;

  const ups = gainExp(xp);

  let drop = null;
  if (chance(mob.drop)) drop = newItem(mob.floor, { luck: st.luck, kind: mob.kind });
  if (drop) {
    if (S.autoSell >= 0 && drop.rar <= S.autoSell) {
      const g = sellValue(drop);
      S.gold += g; S.totalGold += g;
      drop = Object.assign({}, drop, { sold: g });
    } else if (S.bag.length >= BAL.invMax) {
      /* 背包满了：新装备更强就顶掉最弱的一件，否则才折算成零花钱。
         否则玩家一旦背包塞满，就再也没法换装了。 */
      let wi = 0, wp = Infinity;
      for (let i = 0; i < S.bag.length; i++) {
        const p = itemPower(S.bag[i]);
        if (p < wp) { wp = p; wi = i; }
      }
      if (itemPower(drop) > wp) {
        const old = S.bag[wi];
        const g = sellValue(old);
        S.gold += g; S.totalGold += g;
        S.bag[wi] = drop;
        if (drop.rar > S.maxRarity) S.maxRarity = drop.rar;
        drop = Object.assign({}, drop, { swapped: old.nm, swappedGold: g });
      } else {
        const g = sellValue(drop);
        S.gold += g; S.totalGold += g;
        drop = Object.assign({}, drop, { sold: g, full: true });
      }
    } else {
      S.bag.push(drop);
      if (drop.rar > S.maxRarity) S.maxRarity = drop.rar;
    }
  }

  checkTitles();
  return { gold, xp, ups, drop };
}

/* 找一个「现在真的打得过」的层：阵亡后不要只退一层，
   否则会在墙上反复撞死，日志全是阵亡，体验很差。
   退避范围随层数放大（后期一层怪物的强度跨度更大）。 */
function autoRetreat() {
  const st = computeStats();
  let f = Math.max(1, G.floor);
  const minF = Math.max(1, f - Math.max(40, Math.round(f * 0.3)));
  while (f > minF && !canBeat(st, mkMob(f))) f--;
  return f;
}

/* 主角阵亡 */
function onHeroDown() {
  const S = G;
  S.deaths++;
  /* 记住「撞死在哪一层 + 当时的战力」：只有真的变强了才再去挑战，
     否则会一直往上撞。注意不能只看「升级了没」——升级了但没分配属性点，
     战力其实一点没涨，那样会陷入「升级→撞死→升级」的死循环。 */
  S.wallFloor = Math.max(S.wallFloor || 0, G.floor);
  S.wallPower = Math.max(S.wallPower || 0, computeStats().power);
  S.hp = 0;
  if (B.mob) B.mob.hp = B.mob.maxHp;          // 怪物回满，下次重打
  if (S.autoFloor) S.floor = autoRetreat();
  return true;
}

/** 战力比撞墙时高出一截 → 解除封锁，可以再冲一次 */
const WALL_CLEAR_RATIO = 1.15;
function clearWallIfStronger() {
  if (!G.wallFloor) return false;
  if (computeStats().power > (G.wallPower || 0) * WALL_CLEAR_RATIO) {
    const f = G.wallFloor;
    G.wallFloor = 0; G.wallPower = 0;
    logLine(`💪 凡哥变强了，再去第 ${f} 层碰一碰。`, 'good');
    return true;
  }
  return false;
}

/* 复活（满血） */
function revive() {
  const st = computeStats();
  G.hp = st.hp;
  B.round = 0;
  B.buffs = { shield: 0, defBuff: 0, defTurns: 0, mobDefDown: 0, mobDefDownTurns: 0 };
}

/* 换一只新怪：顺便把血回满。
   这一点非常重要——难度模型是按「单场战斗能撑几回合」设计的，
   如果连续打怪不回血，玩家会在自己完全打得过的层上慢慢被磨死，
   表现为「明明碾压却一直阵亡」，整个卡墙机制也就失效了。 */
function nextMob(floor) {
  B.mob = mkMob(floor);
  B.round = 0;
  B.buffs = { shield: 0, defBuff: 0, defTurns: 0, mobDefDown: 0, mobDefDownTurns: 0 };
  const st = computeStats();
  G.hp = st.hp;
  return B.mob;
}

/* ---------------------------------------------------------------
 *  进入某一层
 *  注意：maxFloor 只在真正击杀时推进，所以手动「▶」最多只能走到
 *  前沿 +1 层，没法靠连点刷记录。
 * --------------------------------------------------------------- */
function gotoFloor(f, keepHp) {
  const S = G;
  S.floor = clamp(Math.floor(f), 1, S.maxFloor + 1);
  B.mob = mkMob(S.floor);
  B.round = 0;
  B.buffs = { shield: 0, defBuff: 0, defTurns: 0, mobDefDown: 0, mobDefDownTurns: 0 };
  if (!keepHp) S.hp = computeStats().hp;
  checkTitles();
}

/* ---------------------------------------------------------------
 *  实时战斗循环
 * --------------------------------------------------------------- */
function battleDelay() { return Math.max(70, ROUND_MS / (G.speed || 1)); }
/** 排定下一回合；测试模式下不排，由脚本手动连续调用 tick() */
function scheduleTick(ms) {
  if (B.headless) { B.timer = null; return; }
  B.timer = setTimeout(tick, ms);
}
function startBattle() {
  if (B.headless) return;
  stopBattle();
  scheduleTick(battleDelay());
}
function stopBattle() {
  if (B.timer) { clearTimeout(B.timer); B.timer = null; }
}

function tick() {
  B.timer = null;
  if (!G.auto) { renderBattleState(); return; }
  if (!B.mob) gotoFloor(G.floor, true);

  if (B.dead) {                     // 阵亡停顿中
    revive();
    B.dead = false;
    nextMob(G.floor);
    logLine('😵 凡哥揉揉眼睛，从地上爬起来，血条回满了。', 'sys');
    renderAll();
    scheduleTick(battleDelay());
    return;
  }

  const ev = fightRound();
  playEvents(ev);
  renderFast();

  if (G.hp <= 0) {
    onHeroDown();
    B.dead = true;
    logLine(`💀 凡哥被「${B.mob.nm}」打趴下了` +
      (G.autoFloor && G.floor > 1 ? `，自动退到第 ${G.floor} 层` : '') + '。', 'bad');
    nextMob(G.floor);
    renderAll();
    scheduleTick(Math.max(700, battleDelay() * 2.2));
    return;
  }

  if (B.mob.hp <= 0) {
    const r = onKill(B.mob);
    logKill(B.mob, r);
    /* 升级是个重要的进度点，立刻落盘（浏览器随时可能被关掉） */
    if (r.ups > 0) saveGame(true);
    const freed = clearWallIfStronger();
    /* 自动向更高层推进；如果上次撞死的那层还没把握，就原地刷 */
    const blocked = G.wallFloor > 0 && G.floor + 1 >= G.wallFloor;
    if (G.autoFloor && !blocked) gotoFloor(G.floor + 1, false);
    else nextMob(G.floor);
    maybeRemindPoints(freed);
    renderAll();
    scheduleTick(battleDelay());
    return;
  }

  scheduleTick(battleDelay());
}

/* ---------------------------------------------------------------
 *  「秒杀本层」：连续推掉打得过的层，直到打不动
 * --------------------------------------------------------------- */
function skipFloor() {
  if (!B.mob) gotoFloor(G.floor, true);
  const kills = [];
  let n = 0;
  while (n < 300) {
    const mob = B.mob;
    if (mob.hp > 0 && !canBeat(computeStats(), mob)) break;
    const r = onKill(mob);
    kills.push({ mob, r });
    if (!G.autoFloor) { B.mob = mkMob(G.floor); B.round = 0; break; }
    G.floor++;
    if (G.floor > G.maxFloor) G.maxFloor = G.floor;
    B.mob = mkMob(G.floor);
    B.round = 0;
    n++;
  }
  if (!kills.length) { toast('这一层还打不过，先提升装备吧', 'bad'); return; }
  const totG = kills.reduce((a, k) => a + k.r.gold, 0);
  const totX = kills.reduce((a, k) => a + k.r.xp, 0);
  const drops = kills.filter(k => k.r.drop && !k.r.drop.sold).length;
  const ups = kills.reduce((a, k) => a + k.r.ups, 0);
  logLine(`⚡ 一口气推掉了 <b>${kills.length}</b> 层，+${fmt(totG)} 零花钱，+${fmt(totX)} 经验` +
    (drops ? `，拾取 ${drops} 件装备` : '') + (ups ? `，<b>升了 ${ups} 级</b>` : '') + '。', 'epic');
  G.hp = computeStats().hp;
  checkTitles();
  renderAll();
}

/** 粗估能否打得过（秒杀 / 自动推进判断用） */
function canBeat(st, mob) {
  const myDmg = avgDamage(st, mob, {});
  const mobDmg = avgDamage(mob, st, {});
  const myRounds = mob.hp / Math.max(1, myDmg);
  const mobRounds = st.hp / Math.max(1, mobDmg);
  return myRounds * 1.25 < mobRounds;
}

/* ---------------------------------------------------------------
 *  属性点提醒
 *  放置游戏里最常见的「玩不动了」其实是不分配属性点：
 *  等级涨了、战力没涨，于是卡在同一层反复阵亡。
 *  每 45 秒温和提醒一次，不打断操作。
 * --------------------------------------------------------------- */
let lastPtsRemind = 0;
function maybeRemindPoints(force) {
  if (G.pts < 20) return;
  const now = Date.now();
  if (!force && now - lastPtsRemind < 45000) return;
  lastPtsRemind = now;
  logLine(`💡 你还有 <b>${G.pts}</b> 点属性点没分配 —— 点左边的「+」，或者按「一键分配」。`, 'sys');
  toast('💡 有 ' + G.pts + ' 点属性点待分配', 'gold');
}

/* ---------------------------------------------------------------
 *  称号检测
 * --------------------------------------------------------------- */
function checkTitles() {
  const S = G;
  let got = null;
  for (const t of TITLES) {
    if (S.titles[t.id]) continue;
    let ok = false;
    try { ok = !!t.cond(S); } catch (e) { ok = false; }
    if (ok) {
      S.titles[t.id] = true;
      got = t;
      logLine(`🏅 获得称号：<b>${t.nm}</b> —— ${t.ds}`, 'epic');
      toast('🏅 新称号：' + t.nm, 'gold');
    }
  }
  return got;
}

/* ---------------------------------------------------------------
 *  转生
 * --------------------------------------------------------------- */
/** 转生收益：随进度「次线性」增长（√等级 / √层数），避免指数膨胀 */
function rebirthGain(S) {
  return Math.floor(Math.sqrt(S.lv) * BAL.rebirthLvK) +
         Math.floor(Math.sqrt(S.maxFloor) * BAL.rebirthFloorK);
}
function canRebirth() { return G.lv >= BAL.rebirthLevel; }

function doRebirth() {
  const S = G;
  if (!canRebirth()) { toast(`需要达到 ${BAL.rebirthLevel} 级才能转生`, 'bad'); return; }
  const gain = rebirthGain(S);
  S.rebirth++;
  S.power += gain;
  /* 重置等级 / 属性 / 经验 / 层数，保留装备、金币、技能、称号、伙伴 */
  S.lv = 1; S.exp = 0; S.pts = BAL.startPts;
  S.alloc = { int: 0, phy: 0, agi: 0, luk: 0 };
  S.floor = 1; S.maxFloor = 1;
  B.buffs = { shield: 0, defBuff: 0, defTurns: 0, mobDefDown: 0, mobDefDownTurns: 0 };
  B.mob = mkMob(1); B.round = 0;
  S.hp = computeStats().hp;
  checkTitles();
  logLine(`🌀 <b>转生成功！</b>凡哥在晚自习的桌上猛地醒来，又慢慢趴了回去…… 获得 <b>${gain}</b> 点凡力（累计 ${S.power}）。`, 'epic');
  toast('🌀 转生完成 · 凡力 +' + gain, 'gold');
  closeModal();
  renderAll();
  saveGame(true);
}


/* ==================== src/js/30-gear.js ==================== */
/* =====================================================================
 *  30-gear —— 装备生成 / 随机词条 / 背包装卸 / 强化（含碎裂）
 * ===================================================================== */

/* ---------------------------------------------------------------
 *  加权随机
 * --------------------------------------------------------------- */
function weightedPick(arr, wkey) {
  let total = 0;
  for (const a of arr) total += (a[wkey || 'w'] || 1);
  let r = Math.random() * total;
  for (const a of arr) { r -= (a[wkey || 'w'] || 1); if (r <= 0) return a; }
  return arr[arr.length - 1];
}

/* ---------------------------------------------------------------
 *  基底名称档位（每 15 层换一档）
 * --------------------------------------------------------------- */
function tierIdx(slot, floor) {
  const arr = BASES[slot];
  return clamp(Math.floor((floor - 1) / 15), 0, arr.length - 1);
}

const PCT_STATS = { crit: 1, cdmg: 1, ls: 1, pen: 1 };

/* ---------------------------------------------------------------
 *  生成一件装备
 *  - 固有属性（黑字）：由槽位 + 物品等级 + 品质决定
 *  - 附加属性（绿字）：白 0 条 / 绿 1 / 蓝 2 / 紫 3 / 橙 4，去重
 * --------------------------------------------------------------- */
function newItem(floor, opts) {
  opts = opts || {};
  const luck = opts.luck || 0, kind = opts.kind || 'normal';
  const slot = pick(SLOT_IDS);
  const rar = rollRarity(luck, floor, kind);
  const R = RARITY[rar];
  const ilvl = Math.max(1, Math.round(floor * rndf(0.92, 1.08)));

  /* 固有属性 */
  const prim = {};
  const sp = SLOT_PRIM[slot];
  for (const k in sp) {
    const c = sp[k][0], e = sp[k][1];
    prim[k] = Math.max(1, Math.round(c * Math.pow(ilvl, e) * R.mult * rndf(0.92, 1.08)));
  }

  /* 附加属性（同名词条不重复） */
  const aff = [];
  const used = {};
  for (let i = 0; i < R.affix; i++) {
    const pool = AFFIX_POOL.filter(a => !used[a.id]);
    if (!pool.length) break;
    const a = weightedPick(pool);
    used[a.id] = true;
    let v = a.c * Math.pow(ilvl, a.e) * R.mult * rndf(0.85, 1.18);
    v = PCT_STATS[a.id] ? Math.round(v * 10000) / 10000 : Math.max(1, Math.round(v));
    aff.push({ id: a.id, v });
  }

  const b = BASES[slot][tierIdx(slot, floor)];
  const dep = depthOf(floor);
  return {
    uid: G.uid++,
    slot, nm: (dep > 1 ? '幻' + dep + '·' : '') + b.nm, ic: b.ic,
    ilvl, rar, enh: 0, prim, aff,
    t: Date.now(),
  };
}

/* ---------------------------------------------------------------
 *  新档初始装备：不穿衣服开局会让前 20 层特别难受，
 *  参考难度模型也假设玩家是「有装备」的，所以直接发一套。
 * --------------------------------------------------------------- */
function starterItem(slot, ilvl, rar) {
  const R = RARITY[rar];
  const prim = {};
  const sp = SLOT_PRIM[slot];
  for (const k in sp) {
    prim[k] = Math.max(1, Math.round(sp[k][0] * Math.pow(ilvl, sp[k][1]) * R.mult));
  }
  const b = BASES[slot][0];
  return { uid: G.uid++, slot, nm: b.nm, ic: b.ic, ilvl, rar, enh: 0, prim, aff: [], t: Date.now() };
}
function giveStarterGear() {
  let n = 0;
  SLOT_IDS.forEach((sid, i) => {
    if (!G.gear[sid]) { G.gear[sid] = starterItem(sid, 2, i < 2 ? 1 : 0); n++; }
  });
  return n;
}

/* ---------------------------------------------------------------
 *  展示 / 估值
 * --------------------------------------------------------------- */
function rarityOf(it) { return RARITY[it.rar] || RARITY[0]; }
function itemName(it) { return it.nm + (it.enh > 0 ? ' +' + it.enh : ''); }
function itemTitle(it) { return `[${rarityOf(it).nm}] ${itemName(it)}`; }

/** 词条展示文本 */
function affixText(a) {
  const nm = STAT_NM[a.id] || a.id;
  return PCT_STATS[a.id] ? `${nm} +${(a.v * 100).toFixed(1)}%` : `${nm} +${fmt(a.v)}`;
}
function primText(it) {
  const out = [];
  for (const k in it.prim) {
    const nm = STAT_NM[k] || k;
    const v = it.prim[k] * (1 + ENH_GAIN * it.enh);
    out.push(`${nm} +${fmt(v)}`);
  }
  return out;
}

function sellValue(it) {
  const base = 12 * Math.pow(it.ilvl, 1.32) * (1 + it.rar * 0.7);
  return Math.floor(base * (1 + (it.enh || 0) * 0.8));
}

/* ---------------------------------------------------------------
 *  强化
 * --------------------------------------------------------------- */
function enhanceCost(it) {
  const n = it.enh || 0;
  return Math.floor((60 + it.ilvl * 22) * Math.pow(n + 1, 1.78) * (1 + it.rar * 0.18));
}
/** 目标强化等级（当前 +1）的成功率与碎裂率 */
function enhanceOdds(it, luck) {
  if ((it.enh || 0) >= BAL.maxEnh) return { p: 0, brk: 0, max: true };
  const t = ENH_TABLE[it.enh || 0];
  const pBonus = 1 - 1 / (1 + Math.max(0, luck) * ENH_LUCK_P);
  const brkMult = 1 / (1 + Math.max(0, luck) * ENH_LUCK_BRK);
  const p = clamp(t.p + pBonus, 0.02, 0.99);
  const brk = Math.max(0, t.brk * brkMult);
  return { p, brk, max: false };
}

/** 返回 'ok' | 'fail' | 'break' | 'poor' */
function doEnhance(it) {
  const S = G;
  if (!it) return 'none';
  if ((it.enh || 0) >= BAL.maxEnh) { toast('已经是 +' + BAL.maxEnh + ' 了', 'bad'); return 'max'; }
  const cost = enhanceCost(it);
  if (S.gold < cost) { toast('零花钱不够，还差 ' + fmt(cost - S.gold), 'bad'); return 'poor'; }

  const st = computeStats();
  const odds = enhanceOdds(it, st.luck);
  S.gold -= cost;

  if (chance(odds.p)) {
    it.enh = (it.enh || 0) + 1;
    if (it.enh > S.maxEnh) S.maxEnh = it.enh;
    checkTitles();
    logLine(`🔨 <b>${itemTitle(it)}</b> 强化成功！`, 'good');
    return 'ok';
  }
  if (odds.brk > 0 && chance(odds.brk)) {
    /* 碎裂：装备消失 */
    removeItemEverywhere(it);
    logLine(`💥 <b>${itemTitle(it)}</b> 强化失败，<b>碎成了粉笔灰</b>……`, 'bad');
    toast('💥 装备碎了！', 'bad');
    return 'break';
  }
  logLine(`🔨 <b>${itemTitle(it)}</b> 强化失败，装备保住了。`, '');
  return 'fail';
}

function removeItemEverywhere(it) {
  for (const sid of SLOT_IDS) if (G.gear[sid] && G.gear[sid].uid === it.uid) G.gear[sid] = null;
  G.bag = G.bag.filter(x => x.uid !== it.uid);
  if (UI.selItem && UI.selItem.uid === it.uid) UI.selItem = null;
}

/* ---------------------------------------------------------------
 *  穿脱 / 出售
 * --------------------------------------------------------------- */
function equipItem(it) {
  const S = G;
  const old = S.gear[it.slot];
  S.gear[it.slot] = it;
  S.bag = S.bag.filter(x => x.uid !== it.uid);
  if (old) S.bag.push(old);
  UI.selItem = null;
  /* 换装可能导致最大生命变化 */
  const st = computeStats();
  if (S.hp > st.hp) S.hp = st.hp;
  checkTitles();
  renderAll();
}

function unequipSlot(sid) {
  const S = G;
  const it = S.gear[sid];
  if (!it) return;
  if (S.bag.length >= BAL.invMax) { toast('背包满了', 'bad'); return; }
  S.gear[sid] = null;
  S.bag.push(it);
  UI.selItem = null;
  const st = computeStats();
  if (S.hp > st.hp) S.hp = st.hp;
  renderAll();
}

function sellItem(it) {
  const g = sellValue(it);
  G.gold += g; G.totalGold += g;
  removeItemEverywhere(it);
  toast('卖出 ' + itemName(it) + '，+' + fmt(g) + ' 零花钱', 'gold');
  renderAll();
}

/** 一键卖掉背包里所有「弱于当前装备」的散件 */
function sellAllTrash() {
  const S = G;
  let gold = 0, n = 0;
  const keep = [];
  for (const it of S.bag) {
    const cur = S.gear[it.slot];
    if (!cur || itemPower(it) < itemPower(cur) * 0.98) {
      gold += sellValue(it); n++;
    } else keep.push(it);
  }
  S.bag = keep;
  S.gold += gold; S.totalGold += gold;
  toast(n ? `卖掉 ${n} 件，+${fmt(gold)} 零花钱` : '没有可以卖的散件', n ? 'gold' : '');
  renderAll();
}

/** 一键穿上背包里每个槽位最强的一件 */
function autoEquip() {
  const S = G;
  let n = 0;
  for (const sid of SLOT_IDS) {
    let best = S.gear[sid], bestP = itemPower(S.gear[sid]);
    for (const it of S.bag) {
      if (it.slot !== sid) continue;
      const p = itemPower(it);
      if (p > bestP) { bestP = p; best = it; }
    }
    if (best && best !== S.gear[sid]) {
      const old = S.gear[sid];
      S.gear[sid] = best;
      S.bag = S.bag.filter(x => x.uid !== best.uid);
      if (old) S.bag.push(old);
      n++;
    }
  }
  const st = computeStats();
  if (S.hp > st.hp) S.hp = st.hp;
  checkTitles();
  toast(n ? `换上了 ${n} 件更强的装备` : '现在就是最强配置', n ? 'good' : '');
  renderAll();
}

/* ---------------------------------------------------------------
 *  属性点分配
 * --------------------------------------------------------------- */
function allocPoint(key) {
  if (G.pts <= 0) return;
  G.pts--;
  G.alloc[key]++;
  const st = computeStats();
  if (G.hp > st.hp) G.hp = st.hp;
  renderAll();
}

const ALLOC_KEYS = ['int', 'phy', 'agi', 'luk'];
const ALLOC_NM = {
  int: { nm: '智力', ic: '🧠', ds: '攻击力' },
  phy: { nm: '体能', ic: '💪', ds: '生命 / 防御' },
  agi: { nm: '敏捷', ic: '⚡', ds: '速度 / 暴击' },
  luk: { nm: '幸运', ic: '🍀', ds: '掉落 / 强化' },
};
/** 一键分配：按当前装备短板补齐 */
function autoAlloc() {
  const S = G;
  if (S.pts <= 0) { toast('没有可分配的属性点', ''); return; }
  let n = 0;
  /* 简单策略：智力 40% / 体能 35% / 敏捷 15% / 幸运 10% */
  const plan = [['int', .40], ['phy', .35], ['agi', .15], ['luk', .10]];
  let left = S.pts;
  for (let i = 0; i < plan.length; i++) {
    const [k, w] = plan[i];
    const give = i === plan.length - 1 ? left : Math.floor(S.pts * w);
    S.alloc[k] += give; left -= give; n += give;
  }
  S.pts = 0;
  const st = computeStats();
  G.hp = st.hp;
  toast(`分配了 ${n} 点属性`, 'good');
  renderAll();
}

/* ---------------------------------------------------------------
 *  技能装备 / 被动升级
 * --------------------------------------------------------------- */
function skillUnlocked(id) {
  const sk = SKILL_BY_ID[id];
  if (!sk) return false;
  return G.lv >= sk.lv || G.maxFloor >= sk.lv * 3 || G.rebirth > 0;
}
function toggleSkill(id) {
  const S = G;
  if (!skillUnlocked(id)) { toast('还没解锁这个技能', 'bad'); return; }
  const i = S.skills.indexOf(id);
  if (i >= 0) S.skills.splice(i, 1);
  else {
    if (S.skills.length >= SKILL_SLOTS) { toast(`最多装备 ${SKILL_SLOTS} 个技能`, 'bad'); return; }
    S.skills.push(id);
  }
  renderAll();
}
function upgradePassive(id) {
  const p = PASSIVE_BY_ID[id];
  if (!p) return;
  const cur = G.passives[id] || 0;
  if (cur >= p.max) { toast('已经满级了', 'bad'); return; }
  if (G.sp < p.cost) { toast('技能点不够', 'bad'); return; }
  G.sp -= p.cost;
  G.passives[id] = cur + 1;
  const st = computeStats();
  if (G.hp > st.hp) G.hp = st.hp;
  renderAll();
}

/* ---------------------------------------------------------------
 *  伙伴
 * --------------------------------------------------------------- */
function petUnlocked(id) {
  const p = PETS.find(x => x.id === id);
  return p && G.maxFloor >= p.floor;
}
function buyPet(id) {
  const p = PETS.find(x => x.id === id);
  if (!p) return;
  if (!petUnlocked(id)) { toast(`到达第 ${p.floor} 层才能招募`, 'bad'); return; }
  if (G.pets[id]) { toast('已经招募过了', ''); return; }
  if (G.gold < p.cost) { toast('零花钱不够，还差 ' + fmt(p.cost - G.gold), 'bad'); return; }
  G.gold -= p.cost;
  G.pets[id] = true;
  G.activePet = id;
  logLine(`🤝 <b>${p.nm}</b> 加入了凡哥的队伍！`, 'epic');
  toast('🤝 ' + p.nm + ' 加入！', 'gold');
  renderAll();
}
function setActivePet(id) {
  G.activePet = (G.activePet === id) ? null : id;
  const st = computeStats();
  if (G.hp > st.hp) G.hp = st.hp;
  renderAll();
}

];

/* ---------------------------------------------------------------
 *  DOM 小工具
 * --------------------------------------------------------------- */
function h(tag, props, kids) {
  const el = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'title') el.title = v;
    else if (k.slice(0, 2) === 'on') el[k.toLowerCase()] = v;
    else el.setAttribute(k, v);
  }
  if (kids) {
    const arr = Array.isArray(kids) ? kids : [kids];
    for (const c of arr) {
      if (c === null || c === undefined || c === false) continue;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
  }
  return el;
}
function clear(el) { if (el) while (el.firstChild) el.removeChild(el.firstChild); }
function setHTML(el, s) { if (el) el.innerHTML = s; }
function setText(el, s) { if (el) el.textContent = s; }
function setW(el, p) { if (el) el.style.width = clamp(p, 0, 100).toFixed(1) + '%'; }
/** 属性值统一显示：百分比属性显示成 %，其它用大数缩写 */
function statFmt(k, v) { return PCT_STATS[k] ? (v * 100).toFixed(1) + '%' : fmt(v); }

/* ---------------------------------------------------------------
 *  战斗日志
 * --------------------------------------------------------------- */
function logLine(html, cls) {
  const box = EL.log;
  if (!box) return;
  const d = h('div', { class: 'ln ' + (cls || '') });
  d.innerHTML = html;
  box.appendChild(d);
  UI.logCount++;
  while (box.childNodes.length > 130) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

/* ---------------------------------------------------------------
 *  飘字
 * --------------------------------------------------------------- */
function floatText(txt, cls, xPct, yPct) {
  if (B.headless) return;
  const arena = EL.arena;
  if (!arena) return;
  const d = h('div', {
    class: 'float ' + cls, text: txt,
    style: `left:${xPct}%;top:${yPct}%;transform:translate(-50%,0)`,
  });
  arena.appendChild(d);
  setTimeout(() => { if (d.remove) d.remove(); else if (d.parentNode) d.parentNode.removeChild(d); }, 1100);
}
function arenaFlash(cls) {
  if (B.headless) return;
  const a = EL.arena;
  if (!a) return;
  a.classList.add(cls);
  setTimeout(() => a.classList.remove(cls), 380);
}
function faceHurt() {
  if (B.headless) return;
  const f = EL.face;
  if (!f) return;
  f.classList.add('hurt');
  setTimeout(() => f.classList.remove('hurt'), 220);
}

/* ---------------------------------------------------------------
 *  事件播报
 * --------------------------------------------------------------- */
function playEvents(ev) {
  let heroDealt = 0, mobDealt = 0, heal = 0, ls = 0, crit = false, skillNm = null;
  const extras = [];
  for (const e of ev) {
    if (e.t === 'hit' && e.side === 'mob') {
      heroDealt += e.dmg; if (e.crit) crit = true; if (e.skill) skillNm = e.skill;
    } else if (e.t === 'hit' && e.side === 'hero') {
      mobDealt += e.dmg; crit = crit || e.crit;
    } else if (e.t === 'lifesteal') ls += e.heal;
    else if (e.t === 'skill') {
      if (e.kind === 'heal') extras.push(`🥤 ${e.nm} 回血 ${fmt(e.v)}`);
      if (e.kind === 'shield') extras.push(`😴 ${e.nm} 减伤 ${pct(e.v, 0)}`);
      if (e.kind === 'buff') extras.push(`🌬️ ${e.nm} 防御+${pct(e.v, 0)}（${e.turns}回合）`);
    } else if (e.t === 'pet') {
      if (e.pet === 'xiaoyu') extras.push(`🍬 林小雨回血 ${fmt(e.heal)}`);
      if (e.pet === 'xueba') extras.push(`🎓 学霸同桌补刀 ${fmt(e.dmg)}`);
      if (e.pet === 'banzhuren') extras.push('🧑‍🏫 班主任点名：怪物防御下降');
    }
  }

  const st = computeStats(), mob = B.mob;
  if (heroDealt > 0 && mob) {
    floatText((crit ? '暴击 ' : '') + fmt(heroDealt), crit ? 'crit' : 'dmg', 78, 90);
    arenaFlash('flash-good');
  }
  if (mobDealt > 0) {
    floatText('-' + fmt(mobDealt), 'hurt', 22, 90);
    arenaFlash('flash-bad');
    faceHurt();
  }
  if (ls > 0) floatText('+' + fmt(ls), 'heal', 32, 72);

  /* 战斗日志：每回合一行 */
  if (heroDealt > 0 || mobDealt > 0) {
    const p = [];
    if (skillNm) p.push(`<b>【${skillNm}】</b>`);
    if (heroDealt > 0) p.push(`凡哥造成 <span style="color:#ffd479">${fmt(heroDealt)}</span>${crit ? ' <span style="color:#ff9a3c">暴击!</span>' : ''}`);
    if (mobDealt > 0) p.push(`受到 <span style="color:#ff7b8a">${fmt(mobDealt)}</span>`);
    if (ls > 0) p.push(`吸血 ${fmt(ls)}`);
    logLine(`<span class="sm">R${B.round}</span> ${p.join(' ┊ ')}`, crit ? 'kill' : '');
  }
  for (const x of extras) logLine(x, 'loot');
  void st;
}

/* 击杀日志 */
function logKill(mob, r) {
  const tag = mob.kind === 'boss' ? '👑 BOSS' : mob.kind === 'elite' ? '⭐ 精英' : '';
  logLine(`${tag} <b>${mob.nm}</b> 倒下了 · +${fmt(r.gold)} 零花钱 · +${fmt(r.xp)} 经验`, 'kill');
  if (r.ups > 0) logLine(`🎉 <b>升级！</b>凡哥现在 Lv ${G.lv}，获得 ${r.ups * BAL.ptsPerLevel} 点属性点` +
    `${r.ups >= 2 ? '（连升 ' + r.ups + ' 级）' : ''}${G.pts > 0 ? ' —— <span style="color:#ffcf6b">记得在左边分配属性点</span>' : ''}`, 'epic');
  if (r.drop) {
    if (r.drop.sold) logLine(`💰 掉落的 <b>${r.drop.nm}</b> 自动换成 ${fmt(r.drop.sold)} 零花钱`, 'loot');
    else logLine(`🎁 掉落：<span class="${rarityOf(r.drop).cls}"><b>${itemTitle(r.drop)}</b></span>（Lv${r.drop.ilvl}）`, 'loot');
  }
}

function renderArena() {

    ofx.push(h('span', { class: 'fxTag', text: `约 ${Math.ceil(mob.hp / Math.max(1, mine))} 回合` }));
  }
  clear(EL['h-fx']); hfx.forEach(x => EL['h-fx'].appendChild(x));
  clear(EL['o-fx']); ofx.forEach(x => EL['o-fx'].appendChild(x));
}

function renderBattleState() {
  const b = EL['btn-battle'], d = EL['state-dot'], t = EL['state-txt'];
  if (b) {
    b.textContent = G.auto ? '⏸ 暂停战斗' : '▶ 继续战斗';
    b.className = 'btn ' + (G.auto ? 'on' : '');
  }
  /* 卡墙：上次撞死在第 N 层，升级之前不再硬冲 */
  const stuck = G.wallFloor > 0 && G.floor + 1 >= G.wallFloor;
  if (d) d.className = 'dot' + (!G.auto ? ' off' : B.dead ? ' dead' : stuck ? ' off' : '');
  if (t) {
    setText(t, !G.auto ? '已暂停'
      : B.dead ? '阵亡复活中'
        : stuck ? `卡在第 ${G.wallFloor} 层 · 先刷到升级`
          : '自动战斗中');
  }
}

/* ---------------------------------------------------------------
 *  渲染：标签页
 * --------------------------------------------------------------- */
function renderTabs() {
  clear(EL.tabs);
  TABS.forEach((t, i) => {
    const badge = t.id === 'bag' ? G.bag.length : 0;
    const btn = h('button', {
      class: 'tab' + (UI.tab === t.id ? ' on' : ''), title: '快捷键 ' + (i + 1),
      onclick: () => { UI.tab = t.id; renderAll(); },
